name: Continuous Integration & Verification

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  verify:
    name: Build, Typecheck & Automated Test Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck (tsc --noEmit)
        run: npm run check-types

      - name: Run SQLite & Unit Test Suite (vitest)
        run: npm test

      - name: Run Cloudflare Workers Runtime Test Suite (@cloudflare/vitest-pool-workers)
        run: npm run test:workers

      - name: Verify Fallback Data Synchronization
        run: node scripts/verify_fallback_sync.js

      - name: Exercise Physical Database Restore Drill
        run: node scripts/drill_database_restore.js

      - name: Build Unified Static Site & Admin Bundle
        run: npm run build

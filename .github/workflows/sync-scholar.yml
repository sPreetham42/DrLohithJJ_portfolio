name: Sync Google Scholar Metrics

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    # Changed from ubuntu-latest to ubuntu-24.04 to align with the runner update
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Keep v4, but running on ubuntu-24.04 helps

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install scholarly

      - name: Run sync script (Cloudflare D1 Target)
        timeout-minutes: 3
        env:
          WORKER_AUTOMATION_URL: 'https://drlohithjj.in/api/v1/automation/scholar'
          SCHOLAR_SYNC_SECRET: ${{ secrets.SCHOLAR_SYNC_SECRET }}
          PUBLIC_READ_URL: 'https://drlohithjj.in/api/v1/public/scholar-stats'
          PYTHONUNBUFFERED: '1'
        run: python scripts/sync_scholar.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated metrics
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json data/scholar_sync_status.json
          git commit -m "chore: auto-update scholar metrics [$(date -u +%Y-%m-%d)]"
          git push
